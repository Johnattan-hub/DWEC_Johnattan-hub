<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enlaces externos naranjas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>Enlaces externos naranjas</h1>
  <p><a href="https://www.wikipedia.org">Wikipedia</a></p>
  <p><a href="https://www.freecodecamp.org">freeCodeCamp</a></p>
  <p><a href="#inicio">Enlace interno</a></p>
  <p><a href="/contacto">Contacto</a></p>

  <script>
    const enlaces = document.querySelectorAll("a");

    enlaces.forEach(enlace => {
      if (enlace.getAttribute("href").includes("://")) {
        enlace.style.color = "orange";
      }
    });
  </script>
</body>
</html>
